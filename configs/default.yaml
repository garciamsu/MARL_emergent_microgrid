# ==============================================================
# General mode
# ==============================================================

mode: train        # train | offline
offline_run: null  # set run_id if mode=offline

# ==============================================================
# Simulation parameters
# ==============================================================

simulation:
  episodes: 1500
  dt_h: 1.0            # step size in hours (must divide 1.0 exactly)
  seed: 44           # random seed for reproducibility
  dataset: training_v1.csv
  
  # Episode window size in hours (contiguous random window from dataset)
  # Each episode uses a random contiguous window of this size
  # Must be <= dataset length. Default: 48 hours (2 days)
  episode_window_hours: 48

  # Power unit conversion factor (kW/kWh to W/Wh)
  # Applied to: solar_power_*, wind_power_*, demand columns
  # Excludes: price, Datetime columns
  power_scale_factor: 1000.0

  epsilon:
    schedule: linear    # linear | exponential | constant | custom
    start: 1.0
    end: 0.0
    decay: 0.997
    values: []          # only for custom

validation:
  enabled: true
  episodes: 20
  epsilon: 0.0

# ==============================================================
# Discretization parameters
# ==============================================================

discretization:
  power_bins: 10
  price_bins: 5  # Number of bins for price discretization
  soc_bins: 5    # Number of bins for SOC discretization

# ==============================================================
# Stability definition
# ==============================================================

stability:
  window: 200
  metric: IAE
  reference: median50
  tolerance: 1.10

# ==============================================================
# I/O and results
# ==============================================================

io:
  export: true
  results_dir: results
  plots_dir: plots
  evolution_dir: evolution
  checkpoints_dir: checkpoints
  metrics_file: metrics_episode.xlsx
  export_plots_format: svg

# ==============================================================
# Metrics to compute
# ==============================================================

metrics:
  - IAE
  - ISE
  - Var_dif
  - REP
  - GEP
  - Q_norm
  - Mean_Rewards

# ==============================================================
# Agents and their configurations
# ==============================================================

agents:

  solar:
    count: 1
    policy:
      type: tabular_ql
      alpha: 0.15
      gamma: 0.95
    reward:
      type: DefaultSolarReward
      params: {theta=1, beta=0.5, nu=1, xi=0.5}
    state_space:
      - {var: solar_power, source: local,   bins: auto}
      - {var: demand,      source: env,     bins: auto}
      - {var: renewable,   source: global,  bins: auto}
    limits:
      p_max: 100000
      efficiency: 0.98

  wind:
    count: 1
    policy:
      type: tabular_ql
      alpha: 0.15
      gamma: 0.95
    reward:
      type: DefaultWindReward
      params: {theta=1, beta=0.5, nu=1, xi=0.5}
    state_space:
      - {var: wind_power,  source: local,   bins: auto}
      - {var: demand,      source: env,     bins: auto}
      - {var: renewable,   source: global,  bins: auto}
    limits:
      p_max: 100000
      efficiency: 0.95

  battery:
    count: 1
    policy:
      type: tabular_ql
      alpha: 0.15
      gamma: 0.95
    reward:
      type: DefaultBatteryReward
      params: {psi: 1, sigma: 0.89, nu: 0.63, beta: 0.58, xi: 0.63, mu: 0.22}
    state_space:
      - {var: soc,         source: self,    bins: auto}
      - {var: demand,      source: env,     bins: auto}
      - {var: renewable,   source: global,  bins: auto}
    limits:
      capacity_ah: 8800
      v_nom: 48
      soc_min: 0.0
      soc_max: 1.0
      # Initial SOC is now ALWAYS random per episode (as per mandatory changes)
      # Random initial SOC sampled from U[initial_soc_min, initial_soc_max]
      initial_soc_min: 0.0
      initial_soc_max: 1.0
      p_charge_max: 15000
      p_discharge_max: 15000

  grid:
    count: 1
    policy:
      type: tabular_ql
      alpha: 0.15
      gamma: 0.95
    reward:
      type: DefaultGridReward
      params: {psi: 1, sigma: 0.3, nu: 1.5, xi: 0.15}
    state_space:
      - {var: soc_idx,  source: external, bins: auto}
      - {var: demand,   source: env,      bins: auto}
      - {var: renewable,    source: global,   bins: auto}
    limits:
      p_max: 25000
      export_allowed: false

  load:
    count: 1
    policy:
      type: tabular_ql
      alpha: 0.15
      gamma: 0.95
    reward:
      type: DefaultLoadReward
      # Reward parameters:
      #   sigma: reward for correct ON (with internal energy) or OFF (when expensive)
      #   psi: penalty for incorrect ON (when price > comfort_threshold)
      #   nu: penalty for missed opportunity (OFF when internal energy available)
      #   beta: neutral reward for ambiguous situations
      params: {sigma: 1, psi: 1, nu: 1, beta: 0}
    state_space:
      - {var: soc_idx,          source: external,  bins: auto}
      - {var: demand,           source: env,       bins: auto}
      - {var: renewable,        source: global,    bins: auto}
      - {var: price,            source: env,       bins: auto}
    limits:
      # p_load: Controllable load power (W) - AFTER power_scale_factor applied
      # This is the amount of demand that can be shed when action=0.
      # When action=1 (ON):  effective_demand = dataset_demand
      # When action=0 (OFF): effective_demand = dataset_demand - p_load
      #
      # IMPORTANT: Must be LESS than minimum demand in dataset to avoid negative demand.
      # Dataset demand range (after scaling): 2431 W (min) to 13599 W (max), avg 8339 W
      # Current value: 2000 W represents 24% of average demand
      # This value is safe (< min_demand) and provides meaningful load control
      # Alternative: 2187 W (90% of min_demand) for maximum controllable load
      p_load: 2000
      
      # comfort_threshold: Maximum acceptable electricity price (EUR/MWh)
      # Used in reward function to determine if price is "expensive"
      # - If price < comfort_threshold: favorable to turn load ON (if other conditions met)
      # - If price > comfort_threshold: penalty for turning load ON, reward for turning OFF
      #
      # Dataset price range: 0.01 to 45.68 EUR/MWh, avg 21.01 EUR/MWh
      # Price distribution: p25=15, p50=21, p67=25, p75=27, p90=32 EUR/MWh
      # Current value: 25 EUR/MWh → Balanced learning (67.9% cheap, 32.1% expensive)
      # This enables effective price-based learning for demand response
      #
      # ALTERNATIVE VALUES:
      #   - 27 EUR/MWh: Conservative (75% cheap, 25% expensive) - aligns with p75
      #   - 30 EUR/MWh: Permissive (84.8% cheap, only top 15% penalized)
      #   - 20 EUR/MWh: Aggressive (50% cheap, 50% expensive) - more restrictive
      #
      # USAGE: Agent learns to balance THREE conditions:
      #   1. Surplus renewable energy available (renewable > demand)
      #   2. Battery has charge (soc_idx > 1)
      #   3. Market price is acceptable (price < comfort_threshold)
      # Load should be ON when: (surplus OR soc_high) AND price_acceptable
      # Load should be OFF when: price_expensive AND no_internal_energy
      comfort_threshold: 21